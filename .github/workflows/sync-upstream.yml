name: Sync Upstream (保留本地修改)

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # 允许触发其他 Actions
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Sync Upstream via git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Suml-1/Legado_Max.git
          git fetch upstream main
          
          echo "开始合并上游代码..."
          # 如果上游没有更新，merge 会返回 "Already up to date."
          MERGE_RESULT=$(git merge upstream/main --no-edit 2>&1) || {
            echo "::error::❌ 合并发生冲突！请手动解决。"
            exit 1
          }
          echo "$MERGE_RESULT"
          
          # 如果合并结果不是 Already up to date，说明有新代码，才执行推送
          if [[ "$MERGE_RESULT" != *"Already up to date"* ]]; then
            echo "合并成功，正在推送到你的仓库..."
            git push origin main
            
            # 👇 推送完成后，调用 API 触发 Test Build
            # 注意：请把 "test-build.yml" 替换为你 Test Build 工作流实际的文件名
            echo "触发 Test Build 工作流..."
            curl -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/test.yml/dispatches \
              -d '{"ref":"main"}'
          else
            echo "上游没有更新，跳过推送和触发。"
          fi
