name: Sync Upstream (保留本地修改)

on:
  schedule:
    - cron: '0 */1 * * *' # 每1小时运行一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync Upstream via git
        run: |
          # 1. 设置 Git 用户信息，用于记录合并提交
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. 添加上游仓库地址
          git remote add upstream https://github.com/Suml-1/Legado_Max.git
          
          # 3. 获取上游最新代码
          git fetch upstream main
          
          # 4. 尝试合并上游代码 (--no-edit 表示使用默认提交信息)
          echo "开始合并上游代码..."
          git merge upstream/main --no-edit || {
            echo "::error::❌ 合并发生冲突！请手动在本地解决冲突，或者前往 GitHub 仓库手动创建 PR 解决。"
            exit 1
          }
          
          # 5. 推送到你的仓库
          echo "合并成功，正在推送到你的仓库..."
          git push origin main
